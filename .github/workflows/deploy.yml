name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Stockage photos (R2)
        run: npx wrangler r2 bucket list | grep -q tribu-photos || npx wrangler r2 bucket create tribu-photos

      - name: Base de données (D1)
        run: npx wrangler d1 execute tribu --remote --file=schema.sql -y

      - name: Mise en ligne
        run: npx wrangler deploy
